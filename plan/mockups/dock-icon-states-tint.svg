<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" font-family="-apple-system, SF Pro Text, Helvetica, Arial, sans-serif">
  <!--
    Option A — "Tint + status badge". Reuse the base shield glyph from icon/icon.svg,
    recoloured per state, with a small circular status badge in the lower-right
    (macOS badge placement). Recommended, runtime-composed set.
    Laid out 3x2 so QuickLook renders the whole set without clipping.
  -->
  <rect width="760" height="760" fill="#ffffff"/>
  <defs>
    <linearGradient id="bgConnected" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6bff"/><stop offset="0.55" stop-color="#2b53e0"/><stop offset="1" stop-color="#1b3aa8"/>
    </linearGradient>
    <linearGradient id="bgDisconnected" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b93a3"/><stop offset="0.55" stop-color="#6b7385"/><stop offset="1" stop-color="#4c5364"/>
    </linearGradient>
    <linearGradient id="bgConnecting" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24d"/><stop offset="0.55" stop-color="#f0a622"/><stop offset="1" stop-color="#c47f0a"/>
    </linearGradient>
    <linearGradient id="bgError" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset="0.55" stop-color="#e23b3b"/><stop offset="1" stop-color="#a81b1b"/>
    </linearGradient>
    <linearGradient id="shieldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>

    <!-- Base tile geometry (icon.svg scaled 200/1024 = 0.1953). Colours via currentColor-ish vars. -->
    <g id="iconTile">
      <g transform="scale(0.1953)">
        <path d="M300 100 h424 c110 0 200 90 200 200 v424 c0 110 -90 200 -200 200
                 h-424 c-110 0 -200 -90 -200 -200 v-424 c0 -110 90 -200 200 -200 z" fill="var(--bg)"/>
        <path d="M512 236 C560 268 648 316 730 316 C730 316 744 520 698 634
                 C660 728 566 782 512 802 C458 782 364 728 326 634
                 C280 520 294 316 294 316 C376 316 464 268 512 236 Z" fill="url(#shieldFace)"/>
        <g stroke="var(--glyph)" stroke-width="36" stroke-linecap="round" fill="none">
          <path d="M374 424 L512 512"/><path d="M512 512 L650 424"/><path d="M512 512 L512 664"/>
        </g>
        <g fill="var(--glyphDot)">
          <circle cx="374" cy="424" r="40"/><circle cx="650" cy="424" r="40"/><circle cx="512" cy="664" r="40"/>
        </g>
        <circle cx="512" cy="512" r="56" fill="var(--glyph)"/>
        <circle cx="512" cy="512" r="56" fill="none" stroke="#ffffff" stroke-width="16"/>
      </g>
    </g>
  </defs>

  <style>
    .caption { font-size: 15px; fill:#1f2937; font-weight:600; text-anchor:middle; }
    .sub { font-size: 11.5px; fill:#6b7280; text-anchor:middle; }
    .tileConnected    { --bg: url(#bgConnected);    --glyph:#2b53e0; --glyphDot:#1b3aa8; }
    .tileDisconnected { --bg: url(#bgDisconnected); --glyph:#5b6274; --glyphDot:#4c5364; }
    .tileConnecting   { --bg: url(#bgConnecting);   --glyph:#b57a08; --glyphDot:#8a5c04; }
    .tileError        { --bg: url(#bgError);        --glyph:#c22a2a; --glyphDot:#8a1414; }
  </style>

  <text x="380" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Option A — Tint + status badge (recommended)</text>

  <!-- Row 1 -->
  <!-- Connected -->
  <g transform="translate(40,70)">
    <use href="#iconTile" class="tileConnected"/>
    <circle cx="158" cy="158" r="30" fill="#ffffff"/>
    <circle cx="158" cy="158" r="24" fill="#34c759"/>
    <path d="M147 158 l7 7 l14 -15" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="222" class="caption">Connected</text>
    <text x="100" y="240" class="sub">blue · green ✓ dot</text>
  </g>
  <!-- Disconnected -->
  <g transform="translate(280,70)">
    <use href="#iconTile" class="tileDisconnected"/>
    <circle cx="158" cy="158" r="30" fill="#ffffff"/>
    <circle cx="158" cy="158" r="24" fill="none" stroke="#8b93a3" stroke-width="6"/>
    <text x="100" y="222" class="caption">Disconnected</text>
    <text x="100" y="240" class="sub">grey · hollow dot</text>
  </g>
  <!-- Error -->
  <g transform="translate(520,70)">
    <use href="#iconTile" class="tileError"/>
    <circle cx="158" cy="158" r="30" fill="#ffffff"/>
    <circle cx="158" cy="158" r="24" fill="#e23b3b"/>
    <path d="M158 148 l0 12 M158 167 l0 0.5" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <text x="100" y="222" class="caption">Error</text>
    <text x="100" y="240" class="sub">red · ! dot</text>
  </g>

  <!-- Row 2 -->
  <!-- Connecting -->
  <g transform="translate(160,400)">
    <use href="#iconTile" class="tileConnecting"/>
    <circle cx="158" cy="158" r="30" fill="#ffffff"/>
    <circle cx="158" cy="158" r="24" fill="#f0a622"/>
    <g fill="#ffffff"><circle cx="149" cy="158" r="3.5"/><circle cx="158" cy="158" r="3.5"/><circle cx="167" cy="158" r="3.5"/></g>
    <text x="100" y="222" class="caption">Connecting…</text>
    <text x="100" y="240" class="sub">amber · pulsing dot</text>
  </g>
  <!-- Reconnecting -->
  <g transform="translate(400,400)">
    <use href="#iconTile" class="tileConnecting"/>
    <circle cx="158" cy="158" r="30" fill="#ffffff"/>
    <circle cx="158" cy="158" r="24" fill="#f0a622"/>
    <path d="M150 158 a8 8 0 1 1 3 6" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M151 168 l2 -6 l6 2" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="222" class="caption">Reconnecting…</text>
    <text x="100" y="240" class="sub">amber · spinner dot</text>
  </g>

  <text x="380" y="730" class="sub">Same shield artwork throughout — only the canvas tint and the lower-right badge change per state.</text>
</svg>
